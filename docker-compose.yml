services:

  postgres:
    image: postgres:16
    container_name: guess-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpass
      POSTGRES_DB: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - guess-network


  backend1:
    build:
      context: .
      dockerfile: Dockerfile

    image: guess-game-backend:1.0
    container_name: guess-backend-1
    restart: unless-stopped

    environment:
      FLASK_APP: run.py
      FLASK_DB_TYPE: postgres
      FLASK_DB_USER: postgres
      FLASK_DB_NAME: postgres
      FLASK_DB_PASSWORD: secretpass
      FLASK_DB_HOST: postgres
      FLASK_DB_PORT: "5432"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - guess-network


  backend2:
    image: guess-game-backend:1.0
    container_name: guess-backend-2
    restart: unless-stopped

    environment:
      FLASK_APP: run.py
      FLASK_DB_TYPE: postgres
      FLASK_DB_USER: postgres
      FLASK_DB_NAME: postgres
      FLASK_DB_PASSWORD: secretpass
      FLASK_DB_HOST: postgres
      FLASK_DB_PORT: "5432"

    depends_on:
      postgres:
        condition: service_healthy
      backend1:
        condition: service_started

    networks:
      - guess-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: /api

    image: guess-game-frontend:1.0
    container_name: guess-frontend
    restart: unless-stopped

    depends_on:
      - backend1
      - backend2

    ports:
      - "8080:80"

    networks:
      - guess-network


volumes:
  postgres_data:


networks:
  guess-network:
    driver: bridge